name: build

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          ls /usr/local/lib/android/sdk/platforms || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Sign APK
        env:
          KS_B64: ${{ secrets.BT_PROBE_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.BT_PROBE_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          if [ -z "${KS_B64:-}" ] || [ -z "${KS_PASS:-}" ]; then
            echo "::warning::BT_PROBE_KEYSTORE_BASE64 / BT_PROBE_KEYSTORE_PASSWORD not set; keeping the debug signature"
            exit 0
          fi
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          export PATH="$BUILD_TOOLS:$PATH"
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/btprobe.p12"
          zip -q -d "$APK" 'META-INF/*.RSA' 'META-INF/*.SF' 'META-INF/*.DSA' 'META-INF/*.EC' || true
          zipalign -f -p 4 "$APK" aligned.apk
          apksigner sign --ks "$RUNNER_TEMP/btprobe.p12" --ks-type pkcs12 --ks-pass env:KS_PASS --key-pass env:KS_PASS --out "$APK" aligned.apk
          apksigner verify --print-certs "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: btprobe-debug
          path: app/build/outputs/apk/debug/app-debug.apk
